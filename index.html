<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Open BEARER Protocol Demo</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Arial, sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f4f7fb;
        color: #10233f;
      }

      main {
        max-width: 40rem;
        margin: 2rem;
        padding: 2rem;
        background: #ffffff;
        border: 1px solid #d6deeb;
        border-radius: 1rem;
        box-shadow: 0 12px 32px rgba(16, 35, 63, 0.08);
      }

      h1 {
        margin-top: 0;
      }

      p {
        line-height: 1.6;
      }

      .button {
        display: inline-block;
        margin-top: 1rem;
        padding: 0.9rem 1.4rem;
        border-radius: 999px;
        background: #0f62fe;
        color: #ffffff;
        font-weight: 700;
        text-decoration: none;
      }

      .button:focus-visible,
      .button:hover {
        background: #0043ce;
        text-decoration: underline;
      }

      .button:focus-visible {
        outline: 3px solid #10233f;
        outline-offset: 4px;
      }

      .muted {
        color: #4c5d78;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="muted">Conceptual demo only</p>
      <h1>BEARER Protocol GovRAMP Elections Demo</h1>
      <p>
        This repository contains a browser-based demonstration with synthetic data only. It is not a real voting
        system and does not process real votes, identities, credentials, or government records.
      </p>
      <a class="button" href="./BEARER_Protocol_Application.html">Open the demo</a>
    </main>
  </body>
</html>
